<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Ali Akbarzade</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d1117;
      color: #c9d1d9;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }

    .container {
      width: min(95%, 900px);
      margin: auto;
    }

    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);

      color: #f0f6fc;
    }

    h1 {
      margin-top: 0;

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border: 1px solid #30363d;
      border-radius: 6px;

      color: #f0f6fc;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      background: #238636;
      color: white;
      font-size: 14px;
      margin: 4px;
    }

    button:hover {
      background: #2ea043;
    }

    .secondary {
      background: #30363d;
    }

    .secondary:hover {
      background: #484f58;
    }

    .danger {
      background: #da3633;
    }

    .danger:hover {
      background: #f85149;
    }

    .logout {
      background: #da3633;
    }

    hr {
      border: 0;
      border-top: 1px solid #30363d;
      margin: 28px 0;
    }

    .message {
      margin-top: 12px;

    }

    .success {
      color: #3fb950;
    }

      display: none;
    }

    .project {
      border: 1px solid #30363d;
      border-radius: 10px;

      margin: 14px 0;
      background: #0d1117;
    }

    }

      margin: 8px 0;

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="login" class="panel">

    <h1>🔐 Admin Panel</h1>

    <p>Enter the administrator password.</p>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button onclick="togglePassword()">👁 Show / Hide</button>
    <button onclick="login()">Login</button>

    <div id="message" class="message"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="admin" class="panel">

    <div class="top-bar">

      <div>
        <h1>⚙️ Website Editor</h1>
        <p>Welcome, Ali.</p>
      </div>

      <button class="logout" onclick="logout()">Logout</button>

    </div>

    <hr>

    <!-- PROJECTS -->

    <h2>📁 Projects</h2>

    <div id="projects"></div>

    <button onclick="openAddEditor()">＋ Add Project</button>


    <!-- PROJECT EDITOR -->

    <div id="editor" class="editor">

      <h2 id="editorTitle">Add Project</h2>

      <label>Project Name</label>

      <input
        id="projectName"
        type="text"
        placeholder="Universe Creator"
      >

      <label>Description</label>

      <textarea
        id="projectDescription"
        placeholder="A short description of the project..."
      ></textarea>

      <label>Project URL</label>

      <input
        id="projectUrl"
        type="url"
        placeholder="https://github.com/..."
      >

      <button onclick="saveProject()">💾 Save Project</button>

      <button class="secondary" onclick="closeEditor()">
        Cancel
      </button>

    </div>


    <hr>

    <!-- ABOUT -->

    <h2>👤 About</h2>

    <p>
      About-section editing will be added here.
    </p>

    <button class="secondary">
      Edit About
    </button>


    <hr>

    <!-- SKILLS -->

    <h2>🛠 Skills</h2>

    <p>
      Skills editing will be added here.
    </p>

    <button class="secondary">
      Edit Skills
    </button>

  </div>

</div>


<script>

  // =========================================================
  // PASSWORD
  // =========================================================

  const STORED_HASH =
    "daa14ee74bc5d2e966c706f3a15cbb38c30aae6cfb5424208ccec169b7a9e3d6";


  async function sha256(text) {

    const data =
      new TextEncoder().encode(text);

    const hashBuffer =
      await crypto.subtle.digest("SHA-256", data);

    const hashArray =
      Array.from(new Uint8Array(hashBuffer));

    return hashArray
      .map(byte =>
        byte.toString(16).padStart(2, "0")
      )
      .join("");
  }


  async function login() {

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    if (!password) {

      message.textContent =
        "Please enter a password.";

      return;
    }

    const hash =
      await sha256(password);

    if (hash === STORED_HASH) {

      document.getElementById("login").style.display =
        "none";

      document.getElementById("admin").style.display =
        "block";

      message.textContent = "";

      loadProjects();

    } else {

      message.textContent =
        "Wrong password.";

    }
  }


  function togglePassword() {

    const input =
      document.getElementById("password");

    input.type =
      input.type === "password"
        ? "text"
        : "password";
  }


  function logout() {

    document.getElementById("admin").style.display =
      "none";

    document.getElementById("login").style.display =
      "block";

    document.getElementById("password").value = "";

    closeEditor();
  }


  // =========================================================
  // PROJECT DATA
  // =========================================================

  let projects = [];

  let editingIndex = -1;


  function loadProjects() {

    const saved =
      localStorage.getItem("aliWebsiteProjects");

    if (saved) {

      try {

        projects = JSON.parse(saved);

      } catch {

        projects = [];

      }

    }

    renderProjects();
  }


  function saveProjectsToBrowser() {

    localStorage.setItem(
      "aliWebsiteProjects",
      JSON.stringify(projects)
    );
  }


  // =========================================================
  // RENDER PROJECTS
  // =========================================================

  function renderProjects() {

    const container =
      document.getElementById("projects");

    container.innerHTML = "";

    if (projects.length === 0) {

      container.innerHTML =
        '<div class="empty">No projects yet.</div>';

      return;
    }


    projects.forEach((project, index) => {

      const div =
        document.createElement("div");

      div.className = "project";

      div.innerHTML = `

        <div class="project-title">
          ${escapeHtml(project.name)}
        </div>

        <div class="project-description">
          ${escapeHtml(project.description)}
        </div>

        ${
          project.url
            ? `<div>
                <a
                  class="project-link"
                  href="${escapeAttribute(project.url)}"
                  target="_blank"
                  rel="noopener"
                >
                  ${escapeHtml(project.url)}
                </a>
              </div>`
            : ""
        }

        <div style="margin-top:12px">

          <button
            onclick="editProject(${index})"
          >
            ✏️ Edit
          </button>

          <button
            class="danger"
            onclick="deleteProject(${index})"
          >
            🗑 Delete
          </button>

        </div>
      `;

      container.appendChild(div);

    });
  }


  // =========================================================
  // ADD PROJECT
  // =========================================================

  function openAddEditor() {

    editingIndex = -1;

    document.getElementById("editorTitle").textContent =
      "Add Project";

    document.getElementById("projectName").value =
      "";

    document.getElementById("projectDescription").value =
      "";

    document.getElementById("projectUrl").value =
      "";

    document.getElementById("editor").style.display =
      "block";

    document
      .getElementById("projectName")
      .focus();
  }


  // =========================================================
  // EDIT PROJECT
  // =========================================================

  function editProject(index) {

    const project =
      projects[index];

    editingIndex = index;

    document.getElementById("editorTitle").textContent =
      "Edit Project";

    document.getElementById("projectName").value =
      project.name;

    document.getElementById("projectDescription").value =
      project.description;

    document.getElementById("projectUrl").value =
      project.url;

    document.getElementById("editor").style.display =
      "block";

    document
      .getElementById("projectName")
      .focus();
  }


  // =========================================================
  // SAVE PROJECT
  // =========================================================

  function saveProject() {

    const name =
      document.getElementById("projectName").value.trim();

    const description =
      document
        .getElementById("projectDescription")
        .value.trim();

    const url =
      document.getElementById("projectUrl").value.trim();


    if (!name) {

      alert("Project name is required.");

      return;
    }


    const project = {
      name: name,
      description: description,
      url: url
    };


    if (editingIndex === -1) {

      projects.push(project);

    } else {

      projects[editingIndex] =
        project;

    }


    saveProjectsToBrowser();

    renderProjects();

    closeEditor();

  }


  // =========================================================
  // DELETE PROJECT
  // =========================================================

  function deleteProject(index) {

    const project =
      projects[index];

    const confirmed =
      confirm(
        `Delete "${project.name}"?`
      );

    if (!confirmed) {

      return;
    }


    projects.splice(index, 1);

    saveProjectsToBrowser();

    renderProjects();

  }


  // =========================================================
  // CLOSE EDITOR
  // =========================================================

  function closeEditor() {

    document.getElementById("editor").style.display =
      "none";

    editingIndex = -1;

  }


  // =========================================================
  // SECURITY HELPERS
  // =========================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

</script>

</body>
</html>
